<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#216555"><title>La calle de los números</title><style>

:root{--ink:#203f39;--green:#216555;--cream:#faf7ed;--line:#dfe7dc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px}button,select,input{font:inherit}button,select{cursor:pointer}button{border:0;border-radius:14px;padding:14px 22px;background:white;color:var(--ink);font-weight:700;min-height:52px}button:hover{filter:brightness(.96);transform:translateY(-1px)}button:focus-visible,select:focus-visible{outline:4px solid #e7a942;outline-offset:4px}.primary{background:var(--green);color:white}.quiet{background:#e9efe4}header{padding:20px 5%;background:#fffdf7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{font-family:Fredoka,sans-serif;font-size:24px;display:flex;gap:10px;align-items:center}.logo{background:#f5c761;padding:9px;border-radius:12px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select{padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}main{max-width:1160px;margin:auto;padding:36px 28px 60px}h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:500}h1{font-size:clamp(36px,5vw,58px);line-height:1.08;margin:14px 0 18px}h2{font-size:32px;margin:0 0 12px}p{line-height:1.6}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:#54776b}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:35px;align-items:center;margin-bottom:30px}.hero p{max-width:520px;color:#52675d}.town{position:relative;background:#e3eddb;border-radius:30px;height:245px;display:flex;align-items:end;justify-content:center;padding:35px 20px;gap:10px;overflow:hidden}.town:after{content:'';position:absolute;bottom:0;height:24px;background:#d2ddc7;width:100%}.house{position:relative;width:115px;height:126px;background:#fff8e4;border-radius:8px 8px 0 0;text-align:center;padding-top:54px;font-size:42px;box-shadow:0 6px 0 #c7bda2}.house:before{content:'';position:absolute;top:20px;left:-4px;right:-4px;height:28px;background:repeating-linear-gradient(90deg,#e78c74 0 18px,#fff3db 18px 36px);border-radius:3px 3px 12px 12px}.house:nth-child(2){height:160px;background:#f7d782}.house:nth-child(2):before{background:repeating-linear-gradient(90deg,#438875 0 18px,#fff3db 18px 36px)}.sun{position:absolute;right:25px;top:20px;font-size:35px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.level{background:white;border:2px solid #e2e7db;border-radius:23px;overflow:hidden;text-align:left;padding:0;box-shadow:0 5px 0 #e6e8dc}.roof{height:24px;background:repeating-linear-gradient(90deg,var(--accent) 0 24px,#fff7e8 24px 48px)}.levelbody{padding:22px}.levelnum{display:inline-block;border:1px solid #e1e7df;border-radius:8px;padding:5px 9px;font-size:12px;letter-spacing:1px}.level h3{font-size:25px;margin:16px 0 6px}.range{font-size:33px;font-weight:700;display:block;margin:12px 0}.small{font-size:14px;color:#617169}.go{display:block;background:var(--tint);padding:11px;text-align:center;border-radius:10px;margin-top:18px}.note{margin-top:28px;background:#edf1e5;border-radius:16px;padding:18px 24px;display:flex;gap:14px;align-items:center}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}.shops{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.shop{border:2px solid var(--line);text-align:left;padding:26px;box-shadow:0 4px 0 #e4e8dc}.shop span{font-size:38px;float:right}.shop h3{font-size:26px;margin:10px 0}.exercise{max-width:850px;margin:auto;background:white;border:1px solid var(--line);border-radius:26px;padding:30px}.taskbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{background:#edf2e6;padding:7px 12px;border-radius:20px;font-size:14px}.question{text-align:center;margin:24px 0}.number{font-family:Fredoka,sans-serif;font-size:76px;line-height:1.2}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.answer{border:2px solid #dce5d9;font-size:24px;overflow-wrap:anywhere}.answer.correct{background:#ddf1d9;border-color:#51814f}.answer.wrong{background:#fff0d4;border-color:#daaa50}.visual{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;background:#f7f7ee;padding:18px;border-radius:18px}.place{flex:1;min-width:130px;border-radius:14px;padding:12px;text-align:center;background:#e9effa}.place.d{background:#fcebd3}.place.u{background:#e5efdb}.blocks{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0;max-width:230px}.block{display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;font-size:13px;background:#ffffffa8;border-radius:4px;padding:5px;min-width:25px}.block.hundred{width:44px;height:44px;background:repeating-linear-gradient(0deg,transparent 0 7px,#7799c644 7px 8px),repeating-linear-gradient(90deg,#e1eafb 0 7px,#7799c644 7px 8px)}.block.ten{height:43px;background:repeating-linear-gradient(0deg,#f8d59a 0 3px,#ae762a 3px 4px);width:12px;min-width:12px;padding:0}.block.one{width:15px;min-width:15px;height:15px;background:#8eb46b;padding:0}.feedback{min-height:48px;padding:12px 0;font-weight:700;text-align:center}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.hint{padding:18px;background:#fff5d7;border-radius:15px;margin-top:14px;line-height:1.6}footer{text-align:center;font-size:13px;color:#718174;margin-top:32px}@media(max-width:800px){.levels{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.town{display:none}}@media(max-width:520px){main{padding:24px 16px}.levels,.shops{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.exercise{padding:20px}.brand{font-size:20px}.number{font-size:62px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transform:none!important}}
</style><header><div class="brand"><span class="logo">▦</span> La calle de los números</div><div class="controls"><label for="profile" class="small">Mi cuaderno</label><select id="profile"><option value="0">Alumno/a 1</option><option value="1">Alumno/a 2</option></select><button id="sound" class="quiet" aria-pressed="true">🔊 Voz activada</button></div></header><main id="app"></main><script>
const maxima=[99,199,599,999],titles=['Primeros escaparates','Un barrio por descubrir','La gran avenida','Toda la ciudad'],colors=['#72a78b','#e6b65b','#89a9c9','#ce99a7'],tints=['#e6f1e6','#fcf0d6','#e6eef7','#f7e7ec'];
const shops=[['🍎','Frutería','Cuenta las cantidades','cantidad'],['📦','Almacén','Separa centenas, decenas y unidades','descomponer'],['📚','Librería','Descubre el nombre de los números','nombre'],['🧸','Juguetería','Compara: mayor, menor o igual','comparar']];
let profile=0,sound=true,level=0,type='',q=null,solved=false,hinted=false;let db;try{db=JSON.parse(localStorage.getItem('calleNumerosV1'))||{}}catch{db={}}const app=document.querySelector('#app');
function save(){try{localStorage.setItem('calleNumerosV1',JSON.stringify(db))}catch{}}function data(){return db[profile]||(db[profile]={scores:{},tasks:{}})}function key(){return level+'-'+type}function speak(t){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.83;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function button(t,f,c=''){let b=document.createElement('button');b.textContent=t;b.className=c;b.onclick=f;return b}function words(n){const small=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];if(n<30)return small[n];if(n<100)return ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'][Math.floor(n/10)]+(n%10?' y '+small[n%10]:'');if(n===100)return 'cien';return ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'][Math.floor(n/100)]+(n%100?' '+words(n%100):'')}
function score(l){return shops.reduce((s,x)=>s+(data().scores[l+'-'+x[3]]||0),0)}function home(){stop();type='';app.innerHTML=`<section class="hero"><div><span class="eyebrow">Un paseo para aprender · sin prisas</span><h1>Pequeñas tiendas.<br>Grandes descubrimientos.</h1><p>Cuenta, ordena y juega con los números.<br>Elige tu nivel y abre la puerta de una tienda.</p><span class="badge">✦ Todos los niveles están abiertos</span></div><div class="town" aria-hidden="true"><span class="sun">☀️</span><div class="house">🍎</div><div class="house">🧸</div><div class="house">📚</div></div></section><div class="toprow"><h2>¿Por dónde empezamos?</h2><button id="intro" class="quiet">🔊 Escuchar las instrucciones</button></div><div class="levels"></div><div class="note"><span style="font-size:30px">💡</span><div><b>A tu ritmo, con ayuda</b><br><span class="small">Escucha cada actividad, pide una pista y vuelve al mapa cuando quieras. Tu cuaderno se guarda en este navegador.</span></div></div><footer>Aprender paso a paso · Sin cronómetro · Sin penalizaciones</footer>`;document.querySelector('#intro').onclick=()=>speak('Elige un nivel. En cada nivel hay cuatro tiendas. Puedes escuchar, pedir ayuda y volver al mapa cuando quieras.');maxima.forEach((m,l)=>{let b=button('',()=>{level=l;map() },'level');b.style.setProperty('--accent',colors[l]);b.style.setProperty('--tint',tints[l]);b.innerHTML=`<div class="roof"></div><div class="levelbody"><span class="levelnum">NIVEL ${l+1}</span><h3>${titles[l]}</h3><span class="range">0 – ${m}</span><div class="small">${score(l)} descubrimientos conseguidos</div><span class="go">Entrar al barrio →</span></div>`;document.querySelector('.levels').append(b)})}
function map(){stop();type='';app.innerHTML=`<div class="toprow"><button id="back" class="quiet">← Todos los niveles</button><span class="badge">Nivel ${level+1} · Del 0 al ${maxima[level]}</span></div><span class="eyebrow">Tu barrio de los números</span><h1>Elige una tienda</h1><p>Puedes cambiar de tienda o de nivel en cualquier momento.</p><div class="shops"></div>`;document.querySelector('#back').onclick=home;shops.forEach(s=>{let count=data().scores[level+'-'+s[3]]||0;let b=button('',()=>{type=s[3];q=data().tasks[key()]||make();draw()},'shop');b.innerHTML=`<span>${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p><div class="small">✦ ${count} aciertos · ${data().tasks[level+'-'+s[3]]?'Continuar':'Empezar'} →</div>`;document.querySelector('.shops').append(b)})}
function rand(max){return Math.floor(Math.random()*(max+1))}function shuffle(a){return a.sort(()=>Math.random()-.5)}function make(){let max=maxima[level],n=rand(max),other=rand(max);let opts=new Set([n]);while(opts.size<3)opts.add(rand(max));return {n,other,opts:shuffle([...opts]),correct:false}}
function visual(n){let h=Math.floor(n/100),d=Math.floor(n/10)%10,u=n%10;return `<div class="visual" aria-label="${h} centenas, ${d} decenas y ${u} unidades">${[['Centenas',h,'hundred',100,'c'],['Decenas',d,'ten',10,'d'],['Unidades',u,'one',1,'u']].filter(x=>level||x[4]!=='c').map(x=>`<div class="place ${x[4]}"><b>${x[0]}</b><div class="blocks" aria-hidden="true">${Array.from({length:x[1]},()=>`<span class="block ${x[2]}"></span>`).join('')||'—'}</div><span>${x[1]} × ${x[3]}</span></div>`).join('')}</div>`}
function decomp(n){return (level?Math.floor(n/100)+' C + ':'')+Math.floor(n/10)%10+' D + '+n%10+' U'}
function prompt(){return type==='cantidad'?'¿Cuántos productos hay en el almacén?':type==='descomponer'?'¿Cómo se descompone este número?':type==='nombre'?'¿Cómo se llama este número?':'¿Qué signo va entre los dos números?'}
function readTask(){let t=prompt();if(type==='cantidad')t+=' Cada placa vale cien, cada barra diez y cada cubito uno.';else if(type==='comparar')t+=' '+q.n+' y '+q.other;else t+=' '+q.n;speak(t)}
function draw(){solved=!!q.correct;hinted=false;data().tasks[key()]=q;save();let shop=shops.find(s=>s[3]===type);app.innerHTML=`<div class="toprow"><button id="map" class="quiet">← Volver a las tiendas</button><button id="levels" class="quiet">▦ Cambiar de nivel</button><span class="badge">Nivel ${level+1} · 0–${maxima[level]}</span></div><section class="exercise"><div class="taskbar"><span class="badge">${shop[0]} ${shop[1]}</span><button id="listen" class="quiet">🔊 Escuchar</button></div><div class="question"><h2>${prompt()}</h2>${type==='cantidad'?'<p class="small">Placa = 100 · Barra = 10 · Cubito = 1</p>':`<div class="number">${q.n}${type==='comparar'?' <span style="color:#9cae9b">?</span> '+q.other:''}</div>`}</div>${type==='cantidad'?visual(q.n):''}<div class="answers"></div><div class="feedback" role="status" aria-live="polite">${solved?'¡Ya lo has conseguido! Puedes continuar.':''}</div><div class="actions"><button id="help" class="quiet">💡 Dame una pista</button><button id="next" class="primary">${solved?'Siguiente reto →':'Otro reto →'}</button></div><div id="hint"></div></section><footer>Equivocarse también es aprender. Puedes intentarlo de nuevo.</footer>`;document.querySelector('#map').onclick=map;document.querySelector('#levels').onclick=home;document.querySelector('#listen').onclick=readTask;document.querySelector('#help').onclick=help;document.querySelector('#next').onclick=()=>{stop();q=make();draw()};let choices=type==='comparar'?['<','=','>']:q.opts;choices.forEach(v=>{let label=type==='comparar'?({'<':'< Menor que','=':'= Igual que','>':'> Mayor que'}[v]):type==='nombre'?words(v):type==='descomponer'?decomp(v):String(v);let b=button(label,()=>answer(v,b),'answer');if(type==='nombre'||type==='descomponer')b.style.fontSize='21px';document.querySelector('.answers').append(b)});if(solved)document.querySelectorAll('.answer').forEach(b=>b.disabled=true)}
function answer(v,b){if(solved)return;let correct=type==='comparar'?(q.n<q.other?'<':q.n>q.other?'>':'='):q.n;let f=document.querySelector('.feedback');if(v===correct){solved=true;q.correct=true;b.classList.add('correct');f.textContent='¡Lo has conseguido! ✦ Buen trabajo.';data().scores[key()]=(data().scores[key()]||0)+1;data().tasks[key()]=q;save();document.querySelectorAll('.answer').forEach(a=>a.disabled=true);document.querySelector('#next').textContent='Siguiente reto →';speak('¡Lo has conseguido! Buen trabajo.')}else{b.classList.add('wrong');b.setAttribute('aria-label',b.textContent+'. Prueba otra opción');f.textContent='Vamos paso a paso. Mira la pista y prueba otra vez.';speak('Vamos paso a paso. Mira la pista y prueba otra vez.');help(false)}}
function help(talk=true){hinted=true;let h=Math.floor(q.n/100),d=Math.floor(q.n/10)%10,u=q.n%10;let t=type==='cantidad'?`Cuenta primero las centenas, luego las decenas y después las unidades. ${h} centenas + ${d} decenas + ${u} unidades.`:type==='descomponer'?`Cada cifra tiene un lugar: ${h} centenas, ${d} decenas y ${u} unidades. ${q.n} = ${h*100} + ${d*10} + ${u}.`:type==='nombre'?`Se lee: ${words(q.n)}. Escúchalo y busca la misma palabra.`:q.n===q.other?'Los dos números son iguales. Usa el signo =.':`Compara primero las centenas, después las decenas y luego las unidades. ${q.n} es ${q.n>q.other?'mayor':'menor'} que ${q.other}. El lado abierto del signo mira al número mayor.`;document.querySelector('#hint').innerHTML=`<div class="hint"><b>Vamos paso a paso</b><p>${t}</p>${type==='descomponer'||type==='nombre'?visual(q.n):type==='comparar'?`<div class="small">${q.n}: ${decomp(q.n)}<br>${q.other}: ${decomp(q.other)}</div>`:''}</div>`;if(talk)speak(t)}
document.querySelector('#profile').onchange=e=>{profile=+e.target.value;home()};document.querySelector('#sound').onclick=e=>{sound=!sound;stop();e.target.textContent=sound?'🔊 Voz activada':'🔇 Voz desactivada';e.target.setAttribute('aria-pressed',sound);if(sound)speak('Voz activada')};if(!('speechSynthesis'in window)){document.querySelector('#sound').textContent='Voz no disponible';document.querySelector('#sound').disabled=true;sound=false}home();
</script></html>
